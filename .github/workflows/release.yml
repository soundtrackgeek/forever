name: Release

on:
  push:
    branches:
      - master
    paths:
      - CHANGELOG.md
      - package.json
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version
        shell: pwsh
        run: |
          $version = npm run --silent verify:version
          if (-not $version) {
            throw "Version validation did not return a version."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validated Forever v$version"

      - name: Ensure this version is new
        shell: pwsh
        run: |
          git fetch --tags --force
          if (git tag --list "v$env:APP_VERSION") {
            throw "Release v$env:APP_VERSION already exists. Bump the application version."
          }

      - name: Run frontend quality checks
        run: npm run check

      - name: Run Rust quality checks
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: Forever v__VERSION__
          releaseBody: |
            Download `Forever_*_x64-setup.exe` for the recommended Windows installer.

            Every updater artifact is signed and verified by the application before installation.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Forever_[version]_[arch][setup][ext]
          args: --bundles nsis,msi

      - name: Create release checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi", ".sig" }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -LiteralPath "SHA256SUMS.txt" -Encoding utf8
          gh release upload "v$env:APP_VERSION" "SHA256SUMS.txt"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
