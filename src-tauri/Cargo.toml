[workspace]
members = ["matching"]
default-members = ["."]
resolver = "2"

[package]
name = "forever"
version = "0.0.84"
description = "A polished, modern desktop client for the Soulseek network."
authors = ["soundtrackgeek"]
edition = "2021"
repository = "https://github.com/soundtrackgeek/forever"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "forever_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
keyring = "4.1"
flate2 = "1"
md5 = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
forever-matching = { path = "matching" }
symphonia = { version = "0.6", features = ["all"] }
rustfft = "6.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
zeroize = "1"

tempfile = "3"
igd-next = { version = "0.17.1", features = ["aio_tokio"] }
crab_nat = "0.8.1"
netdev = "0.46.3"
notify = "8.2"
httpdate = "1"
dirs = "6"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }
time = "0.3"
regex = "1"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
lofty = "0.25.4"
sha2 = "0.10"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Networking_Connectivity"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
